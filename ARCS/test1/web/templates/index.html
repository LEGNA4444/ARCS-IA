<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="arcs-token" content="{{ token }}">
  <title>Registro de ARCS</title>
  <link rel="stylesheet" href="https://LEGNA4444.GITHUB.IO/ARCS-IA/ARCS/test1/web/templates/SORCS/css/css.css">
</head>
<body>
  <h1> <img id="arcs-logo" src="https://LEGNA4444.GITHUB.IO/ARCS-IA/ARCS_IA.svg" alt="img de ARCS IA"> Registro de ARCS</h1>
  <p>Versión de términos: {{ version }}</p>

  <div id="terminos"></div>

  <form id="form">
    <label>Nombre de usuario (2 a 32 caracteres: letras minúsculas, números, _ o -)
      <input type="text" id="nombre" required>
    </label>
    <label><input type="checkbox" id="edad"> Confirmo que tengo 18 años o más</label>
    <div id="permisos"></div>
    <button type="submit">Crear cuenta</button>
  </form>

  <div id="mensaje"></div>

  <hr>
  <h2>Borrar cuenta</h2>
  <input type="text" id="nombre_borrar" placeholder="nombre de la cuenta">
  <label><input type="checkbox" id="confirmo_borrar"> Entiendo que se borrará todo</label>
  <button id="borrar">Borrar cuenta</button>

  <script src="https://LEGNA4444.GITHUB.IO/ARCS-IA/ARCS/test1/web/templates/SORCS/js/js.js"></script>
  <footer>
    <p>© 2026 ARCS IA. por LPP™, _LegNar.4.4.4.4 // y SRANGEL grup todos los derechos reservados.<img id="lpp-logo" src="https://LEGNA4444.GITHUB.IO/ARCS-IA/LPP.png" alt="imagen de LPP™"></p>
  </footer>
</body>
</html>
